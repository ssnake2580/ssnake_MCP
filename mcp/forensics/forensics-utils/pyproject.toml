[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forensics-utils-mcp-server"
version = "1.0.0"
description = "MCP Server for forensic analysis with VirusTotal, DIE, and local tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=3,<4",
    "aiohttp>=3.9.0",
    "ccl_chromium_reader @ git+https://github.com/cclgroupltd/ccl_chromium_reader.git",
    "cryptography>=41.0.0",
    "firefox-decrypt @ git+https://github.com/unode/firefox_decrypt.git",
    "lz4>=4.4.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
forensics-mcp-server = "forensics_utils_mcp_server.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["forensics_utils_mcp_server"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
